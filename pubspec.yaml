name: backup_database
version: 3.6.0
publish_to: none

environment:
  sdk: ^3.13.0

description: Sistema de backup automatico para SQL Server, Sybase, PostgreSQL e Firebird

dependencies:
  archive: ^4.2.0
  brasil_fields: ^1.19.0
  cron: ^0.6.2
  crypto: ^3.0.7
  cupertino_icons: ^1.0.9
  desktop_webview_window: ^0.3.0
  dio: ^5.11.0
  drift: ^2.34.3
  ed25519_edwards: ^0.3.2
  ffi: ^2.2.0
  file_picker: ^12.1.2
  fluent_ui: ^4.16.1

  flutter:
    sdk: flutter

  flutter_acrylic: ^1.1.4
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: ^11.0.0

  freezed_annotation: ^3.1.0
  ftpconnect:
    path: packages/ftpconnect

  get_it: ^9.2.1
  go_router: ^18.0.0
  google_fonts: ^8.2.1
  googleapis: ^17.0.0
  http: ^1.2.2
  intl: ^0.20.3
  logger: ^2.7.0
  mailer: ^7.2.0
  meta: ^1.19.0
  oauth2_client: ^4.3.3
  package_info_plus: ^10.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
  provider: ^6.1.5+1
  pub_semver: ^2.2.1
  result_dart: ^2.2.0
  shared_preferences: ^2.5.5
  shimmer: ^4.0.0
  sqlite3: ^3.5.2
  system_theme: ^3.3.0
  timezone: ^0.11.1
  tray_manager: ^0.5.3
  url_launcher: ^6.3.1
  uuid: ^4.6.0
  win32: ^6.4.0
  window_manager: ^0.5.2
  xml: ^7.0.1
  zard: ^1.4.0

dev_dependencies:
  build_runner: ^2.16.0
  coverage: ^1.15.1
  drift_dev: ^2.34.5
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

  flutter_test:
    sdk: flutter

  freezed: ^4.0.0
  ftp_server: ^2.3.2
  mocktail: ^1.0.5
  pubspec_dependency_sorter: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/image/new/database_128px.png
    - assets/image/new/app_tray.ico
flutter_launcher_icons:
  android: false
  windows:
    generate: true
    image_path: assets/image/new/database_512px.png
    icon_size: 256
