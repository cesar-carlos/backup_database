name: backup_database
version: 3.6.14
publish_to: none

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

description: Sistema de backup automatico para SQL Server, Sybase, PostgreSQL e Firebird

dependencies:
  archive: ^4.7.1
  brasil_fields: ^1.22.0
  cron: ^0.6.2
  crypto: ^3.0.8
  cupertino_icons: ^2.0.0
  desktop_webview_window: ^0.3.2
  dio: ^5.11.1
  drift: ^2.35.4
  ed25519_edwards: ^0.3.2
  ffi: ^2.2.0
  file_picker: ^13.4.0
  fluent_ui: ^4.17.0

  flutter:
    sdk: flutter

  flutter_acrylic: ^1.1.4
  flutter_dotenv: ^6.0.2
  flutter_secure_storage: ^11.2.0

  freezed_annotation: ^3.1.0
  ftpconnect:
    path: packages/ftpconnect

  get_it: ^9.3.0
  go_router: ^18.1.4
  google_fonts: ^9.0.0
  googleapis: ^19.0.0
  http: ^1.6.0
  intl: ^0.20.3
  logger: ^2.8.0
  mailer: ^7.3.0
  material_ui: ^1.11.1
  meta: ^1.19.0
  oauth2_client: ^4.3.3
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
  provider: ^6.1.5+1
  pub_semver: ^2.2.1
  result_dart: ^2.2.0
  shared_preferences: ^2.5.6
  shimmer: ^4.0.0
  sqlite3: ^3.9.1
  system_theme: ^3.3.0
  timezone: ^0.11.2
  tray_manager: ^0.9.0
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  win32: ^6.4.0
  window_manager: ^0.7.0
  xml: ^7.1.0
  zard: ^1.4.0

dev_dependencies:
  build_runner: ^2.17.1
  coverage: ^1.15.1
  drift_dev: ^2.35.3
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

  flutter_test:
    sdk: flutter

  freezed: ^4.0.3
  ftp_server: ^2.4.0
  mocktail: ^1.0.5
  pubspec_dependency_sorter: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/image/new/database_128px.png
    - assets/image/new/app_tray.ico
flutter_launcher_icons:
  android: false
  windows:
    generate: true
    image_path: assets/image/new/database_512px.png
    icon_size: 256
