name: Build Installer (Verification)

# Validacao manual antes de publicar. O artefato validado e promovido para a
# release sem recompilar a mesma arvore ao criar a tag.
#
# Esse workflow NAO publica release. Apenas executa
# `python installer/build_installer.py` e sobe o `.exe` + `.sha256`
# como artefato para download manual. A publicacao em si segue o
# fluxo descrito em docs/install/release_guide.md.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch ou tag para validar (default: ref do dispatch)"
        required: false

concurrency:
  group: installer-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Create minimal .env (build only)
        shell: pwsh
        run: |
          if (Test-Path ".env.example") {
            Copy-Item ".env.example" ".env" -Force
          } else {
            @(
              "APP_NAME=Backup Database"
              "SINGLE_INSTANCE_ENABLED=true"
            ) | Set-Content ".env"
          }

      - name: Verify Inno Setup is available
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "Falha ao instalar Inno Setup" }
            $found = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $found) { throw "Inno Setup 6 nao encontrado apos instalacao" }
          }
          Write-Host "OK: $found"

      - name: Test service migration and rollback on Windows
        shell: pwsh
        run: flutter test test/unit/installer/winsw_migration_test.dart test/unit/installer/rollback_update_test.dart test/unit/infrastructure/repositories/administrative_database_test.dart test/unit/infrastructure/external/system/windows_service_presence_probe_test.dart

      - name: Run build_installer.py end-to-end
        shell: pwsh
        run: python installer/build_installer.py

      - name: Locate installer artifact
        id: locate
        shell: pwsh
        run: |
          $latest = Get-ChildItem -Path installer/dist -Filter "BackupDatabase-Setup-*.exe" `
            | Sort-Object LastWriteTime -Descending `
            | Select-Object -First 1
          if (-not $latest) {
            throw "Nenhum instalador encontrado em installer/dist/"
          }
          $sidecar = "$($latest.FullName).sha256"
          if (-not (Test-Path $sidecar)) {
            throw "Sidecar .sha256 ausente para $($latest.Name)"
          }
          "installer_path=$($latest.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "sidecar_path=$sidecar"            | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "installer_name=$($latest.Name)"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload installer + sidecar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate.outputs.installer_name }}
          path: |
            ${{ steps.locate.outputs.installer_path }}
            ${{ steps.locate.outputs.sidecar_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
