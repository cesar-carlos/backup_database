name: Test

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.50.0"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install widgetbook dependencies
        if: ${{ hashFiles('widgetbook/pubspec.yaml') != '' }}
        working-directory: widgetbook
        run: flutter pub get

      - name: Verify W3C design token snapshot is in sync
        run: dart run tools/generate_tokens.dart --check

      - name: Create minimal .env for tests
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "APP_NAME=Backup Database" > .env
            echo "SINGLE_INSTANCE_ENABLED=true" >> .env
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Encoding scan (UTF-8 / mojibake)
        run: python scripts/scan_encoding.py

      - name: Verify Windows icon artifacts
        run: python scripts/verify_windows_icons.py

      - name: Unit tests for Windows icon utils (synthetic ICO/PNG)
        run: python test/scripts/test_windows_icon_utils.py

      - name: Verify dart format
        run: dart format --set-exit-if-changed --output=none lib test tools

      - name: Design system guard (atoms/molecules/organisms)
        run: dart run tools/design_system_guard.dart --fail-on-findings --enforce-target-size

      - name: Reject inline UI locale _t helpers (PR-D D1)
        run: |
          set -euo pipefail
          if grep -RIn --include='*.dart' -E 'String _t\((String pt, String en|BuildContext context, String pt, String en)\)' lib; then
            echo 'Forbidden: inline String _t(...) — use appLocaleString from core/l10n.'
            exit 1
          fi

      - name: Run widget tests
        run: flutter test test/widget --reporter compact

      - name: Analyze widgetbook
        if: ${{ hashFiles('widgetbook/pubspec.yaml') != '' }}
        working-directory: widgetbook
        run: flutter analyze --no-fatal-infos

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
      - run: flutter pub get
      - name: Create test environment
        run: cp .env.example .env
      - name: Run unit tests
        env:
          COLLECT_COVERAGE: ${{ github.event_name != 'pull_request' }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          args=()
          if [ "$COLLECT_COVERAGE" = "true" ]; then args+=(--coverage); fi
          flutter test test/unit/ --total-shards 3 --shard-index "$SHARD_INDEX" --reporter compact "${args[@]}"

      - name: Report filtered line coverage
        if: github.event_name != 'pull_request'
        run: python scripts/coverage.py --filter-only

      - name: Upload filtered coverage report
        uses: actions/upload-artifact@v4
        if: ${{ always() && github.event_name != 'pull_request' }}
        with:
          name: coverage-lcov-filtered-${{ matrix.shard }}
          path: coverage/lcov.filtered.info
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ always() && github.event_name != 'pull_request' && hashFiles('coverage/lcov.filtered.info') != '' }}
        with:
          files: coverage/lcov.filtered.info
          flags: unit-tests
          name: unit-shard-${{ matrix.shard }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  # Preserve the existing required check name; skipped/cancelled jobs fail it.
  test:
    if: always()
    needs: [checks, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require all validations
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
        run: test "$CHECKS_RESULT" = success && test "$UNIT_RESULT" = success
